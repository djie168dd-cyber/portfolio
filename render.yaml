# Render 部署配置（免费 Web Service）
# 用法见《问答助手配置说明.md》第六节，或在 Render 控制台 New > Blueprint 选本仓库。
# server.js 已读取 Render 注入的 PORT，网站与 /api/ask 在同一域名下，前端无需改接口地址。
services:
  - type: web
    name: dengjie-portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # 必填：大模型 API Key，sync:false 表示在 Render 控制台手动填写，不会写进仓库
      - key: LLM_API_KEY
        sync: false
      # 火山引擎方舟（豆包）默认配置；若改用 DeepSeek，把下面两项改为
      #   https://api.deepseek.com / deepseek-chat
      - key: LLM_BASE_URL
        value: https://ark.cn-beijing.volces.com/api/v3
      - key: LLM_MODEL
        value: doubao-seed-2-1-turbo-260628
      # 防滥用限频：同一 IP 每 60 秒最多 12 次问答
      - key: RATE_MAX
        value: "12"
      - key: RATE_WINDOW_MS
        value: "60000"
