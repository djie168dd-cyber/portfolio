    <script>
        // 深色模式切换
        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;
        themeToggle.addEventListener('click', () => {
            const currentTheme = root.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            if (newTheme === 'dark') {
                root.setAttribute('data-theme', 'dark');
            } else {
                root.removeAttribute('data-theme');
            }
            localStorage.setItem('theme', newTheme);
        });

        // 返回顶部按钮
        const backToTop = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                backToTop.classList.add('visible');
            } else {
                backToTop.classList.remove('visible');
            }
        });
        backToTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
    <script>
        const lightbox = document.getElementById("imageLightbox");
        const lightboxImage = document.getElementById("lightboxImage");
        const lightboxCaption = document.getElementById("lightboxCaption");
        const lightboxClose = document.querySelector(".image-lightbox-close");
        let lastTrigger = null;
        const closeLightbox = () => {
            lightbox.classList.remove("active");
            lightbox.setAttribute("aria-hidden", "true");
            document.body.classList.remove("lightbox-open");
            if (lastTrigger) lastTrigger.focus();
        };
        document.querySelectorAll(".case-screenshot-trigger, .case-architecture-trigger").forEach(trigger => {
            trigger.addEventListener("click", () => {
                lastTrigger = trigger;
                lightboxImage.src = trigger.dataset.fullImage;
                lightboxImage.alt = trigger.querySelector("img").alt;
                lightboxCaption.textContent = trigger.dataset.imageLabel;
                lightbox.classList.add("active");
                lightbox.setAttribute("aria-hidden", "false");
                document.body.classList.add("lightbox-open");
                lightboxClose.focus();
            });
        });
        lightboxClose.addEventListener("click", closeLightbox);
        lightbox.addEventListener("click", event => { if (event.target === lightbox) closeLightbox(); });
        window.addEventListener("keydown", event => { if (event.key === "Escape" && lightbox.classList.contains("active")) closeLightbox(); });
    </script>
